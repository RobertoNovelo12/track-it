# ------------------------------------------------------------------
# Rendimiento: compresión y caché del navegador para archivos fijos.
# ------------------------------------------------------------------

# Comprime HTML, CSS, JS, JSON y SVG antes de enviarlos.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml
</IfModule>

<IfModule mod_headers.c>
    # Vite pone un hash en el nombre: si cambia el archivo, cambia el
    # nombre. Se pueden guardar un año sin riesgo.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/fonts/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Logos e íconos: una semana (pueden cambiar con el mismo nombre).
    <LocationMatch "^/images/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # El service worker siempre se revisa para recibir versiones nuevas.
    <LocationMatch "^/sw\.js$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
</IfModule>

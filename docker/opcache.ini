; ------------------------------------------------------------------
; OPcache: PHP guarda compilados los archivos de Laravel en memoria,
; así no los vuelve a leer y compilar en cada petición.
; El contenedor no cambia sus archivos después del deploy, por eso
; no se revisan fechas (validate_timestamps=0). Cada deploy crea un
; contenedor nuevo con la caché vacía.
; ------------------------------------------------------------------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; Caché de rutas de archivos (menos consultas al disco).
realpath_cache_size=4096K
realpath_cache_ttl=600

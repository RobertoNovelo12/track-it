<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3299B2">
    <title>Sin conexión | Track IT</title>
    <style>
        :root { color-scheme: light dark; --fondo: #FFFCFF; --texto: #1F2A2E; --tenue: #66737A; --boton: #3299B2; }
        @media (prefers-color-scheme: dark) { :root { --fondo: #111416; --texto: #E8EDEF; --tenue: #9AA6AB; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
        main { max-width: 360px; }
        img { width: 88px; height: 88px; }
        h1 { margin: 20px 0 8px; font-size: 1.25rem; }
        p { margin: 0 0 24px; color: var(--tenue); line-height: 1.5; font-size: 0.95rem; }
        button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--boton); color: #fff;
                 font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        button:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/track-it/track-it-icono.svg" alt="Track IT">
        <h1>Sin conexión</h1>
        <p>No hay conexión a internet. Revisa tu red y vuelve a intentarlo; lo que estabas haciendo no se ha guardado todavía.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
